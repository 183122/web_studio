# Local/staging stack. Production: managed MySQL/Redis/object storage, TLS at the edge (see docs/operations).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: studio
      MYSQL_USER: studio
      MYSQL_PASSWORD: ${DB_PASSWORD:-studio-local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-local}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: [.env.docker]
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: studio
      DB_USERNAME: studio
      DB_PASSWORD: ${DB_PASSWORD:-studio-local}
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes: [assets:/var/www/apps/platform-api/storage/app/tenant-assets]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: [.env.docker]
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: studio
      DB_USERNAME: studio
      DB_PASSWORD: ${DB_PASSWORD:-studio-local}
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    command: ["php", "artisan", "queue:work", "--queue=build,ai,email,google,webhooks,default", "--tries=3", "--backoff=10", "--max-time=3600", "--timeout=620"]
    volumes: [assets:/var/www/apps/platform-api/storage/app/tenant-assets]
    depends_on: [api]

  # Scheduled jobs (custom-domain re-verification every 10 minutes).
  scheduler:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: [.env.docker]
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: studio
      DB_USERNAME: studio
      DB_PASSWORD: ${DB_PASSWORD:-studio-local}
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    command: ["php", "artisan", "schedule:work"]
    depends_on: [api]

  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    ports: ["8080:8080"]
    depends_on: [api]

volumes:
  mysql:
  assets:
