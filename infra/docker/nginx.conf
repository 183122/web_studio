# Studio host. Set server_name to the studio's public hostname(s) (STUDIO_FRONTEND_URL host).
server {
    listen 8080;
    server_name localhost 127.0.0.1 web;  # "web" = internal calls (edge TLS ask)
    root /usr/share/nginx/html;
    client_max_body_size 13m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # Strict CSP: no inline scripts, no eval; images from self (signed asset URLs) and https; video embeds allowlisted.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location ~ ^/(api|sanctum|up)(/|$) {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/apps/platform-api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

# Published sites: every other Host (platform subdomains *.PLATFORM_BASE_DOMAIN and verified custom
# domains). Laravel resolves the Host to a live release (unknown hosts → 404) — nginx never decides
# which tenant a request belongs to. TLS terminates at the edge (see infra/edge/Caddyfile).
server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 1m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Immutable runtime bundle (same build as the API image's public/runtime).
    location /runtime/ {
        alias /usr/share/nginx/runtime/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The studio API and internal endpoints are never reachable on tenant hosts.
    location ~ ^/(api/v1|api/internal|sanctum)(/|$) {
        return 404;
    }

    location / {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/apps/platform-api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 30s;
    }
}
